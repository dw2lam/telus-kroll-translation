appId: com.davidlam.krolllabel
productName: Telus Kroll Translation Demo
copyright: © 2026 David Lam
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# Releases hold only the installers (see `npm run release`); the app's updater
# finds them by these names, so no update feeds or blockmaps are published.
# No spaces: GitHub renames spaces in asset names.
artifactName: Telus-Kroll-Translation-Demo-${version}-${os}-${arch}.${ext}

# macOS — Apple Silicon only.
mac:
  category: public.app-category.medical
  target:
    - target: dmg
      arch: [arm64]
  identity: null
dmg:
  title: Telus Kroll Translation Demo ${version}
  writeUpdateInfo: false

# Windows — x64 installer, plus a portable exe that runs without installing.
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
portable:
  artifactName: Telus-Kroll-Translation-Demo-${version}-win-portable-x64.${ext}
nsis:
  differentialPackage: false
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Telus-Kroll-Translation-Demo-${version}-win-setup-x64.${ext}
