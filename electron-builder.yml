appId: com.davidlam.krolllabel
productName: Kroll Label
copyright: © 2026 David Lam
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

mac:
  category: public.app-category.medical
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  identity: null
dmg:
  title: Kroll Label ${version}

win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-win-setup-${arch}.${ext}
portable:
  artifactName: ${productName}-${version}-win-portable.${ext}
