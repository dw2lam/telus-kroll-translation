appId: com.davidlam.krolllabel
productName: Kroll Label
copyright: © 2026 David Lam
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asar: true
publish:
  provider: github
  owner: dw2lam
  repo: telus-kroll-translation
  releaseType: release
# No spaces: GitHub renames spaces in asset names, which would break latest*.yml.
artifactName: Kroll-Label-${version}-${os}-${arch}.${ext}

# macOS — Apple Silicon only. The zip is what the update feed (latest-mac.yml) lists.
mac:
  category: public.app-category.medical
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  identity: null
dmg:
  title: Kroll Label ${version}

# Windows — x64 installer only; latest.yml points at it for auto-updates.
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Kroll-Label-${version}-win-setup-x64.${ext}
